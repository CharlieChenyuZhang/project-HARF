# Build spec for when the GitHub repo is connected to the Amplify app
# (Amplify console → App settings → Branch settings). Not used by scripts/deploy.sh.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
